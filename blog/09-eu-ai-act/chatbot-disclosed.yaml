# A customer-facing chatbot with a declared Article 50 disclosure signal.
# valqore evaluate PASSES AIG-179.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-chatbot
  annotations:
    valqore.io/ai-interaction-disclosure: "ui-banner"
  labels:
    app: chatbot
spec:
  replicas: 2
  selector: { matchLabels: { app: chatbot } }
  template:
    metadata:
      labels: { app: chatbot }
    spec:
      containers:
      - name: chatbot
        image: ghcr.io/danny-avila/librechat:v0.7.8
        resources:
          requests: { cpu: "250m", memory: "512Mi" }
          limits:   { cpu: "500m", memory: "1Gi" }
        ports:
        - containerPort: 3080
